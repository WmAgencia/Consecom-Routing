# Railway build hints for the Web service.
# See apps/web/railway.toml for the full config.
[phases.setup]
nixPkgs = ["nodejs_24"]

[phases.install]
cmds = ["corepack enable", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @consecom/web... build"]

[start]
cmd = "node apps/web/.next/standalone/apps/web/server.js"
