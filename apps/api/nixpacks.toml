# Railway build hints for the API service.
# These set the build/start commands when the service Root Directory is `apps/api`.
# See apps/api/railway.toml for the full config.
[phases.setup]
nixPkgs = ["nodejs_24"]

[phases.install]
cmds = ["corepack enable", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @consecom/api... build"]

[start]
# Run with tsx loader — the API workspace imports @consecom/db and
# @consecom/shared as TypeScript source, so we transpile at runtime.
cmd = "cd /app && node --import tsx/esm apps/api/src/main.ts"
