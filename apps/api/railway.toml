[build]
builder = "NIXPACKS"

[deploy]
# Run the API directly with tsx — the workspace packages (@consecom/db,
# @consecom/shared) ship as TypeScript source, not compiled JS, so we use
# tsx to transpile on the fly. Same runtime as `pnpm dev:api`.
startCommand = "node --import tsx/esm src/main.ts"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
