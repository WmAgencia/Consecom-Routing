<script>
(function(){
  var scene=document.querySelector('.cc-hero');
  if(!scene||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var ticking=false;
  function paint(){
    ticking=false;
    var rect=scene.getBoundingClientRect();
    var distance=Math.max(1,window.innerHeight*0.9);
    var progress=Math.min(1,Math.max(0,-rect.top/distance));
    scene.style.setProperty('--cc-scroll',progress.toFixed(4));
    scene.style.setProperty('--cc-cloud-rise',(-24*progress).toFixed(1)+'px');
    scene.style.setProperty('--cc-beam-shift',(-12*progress).toFixed(1)+'px');
  }
  function schedule(){if(!ticking){ticking=true;requestAnimationFrame(paint)}}
  window.addEventListener('scroll',schedule,{passive:true});
  window.addEventListener('resize',schedule,{passive:true});
  paint();
})();
</script>
