<section class="cc-hero" id="inicio" aria-label="Cloud Code sem fronteiras">
  <div class="cc-hero-sticky">
    <div class="cc-hero-atmosphere" aria-hidden="true">
      <div class="cc-hero-beam"></div>
      <div class="cc-hero-beam-glow"></div>
    </div>
    <div class="cc-hero-heading">
      <h1>Cloud Code<span>sem fronteiras</span></h1>
    </div>
    <div class="cc-hero-number cc-hero-number-left">
      <strong>6</strong><span>modelos de ponta</span>
    </div>
    <div class="cc-hero-number cc-hero-number-right">
      <strong>11,3x</strong><span>mais economia</span>
    </div>
    <div class="cc-hero-clouds" aria-hidden="true">
      <svg viewBox="0 0 1600 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <g class="cc-cloud-bank cc-cloud-bank-left">
          <path d="M-60 195 C-8 88 132 73 213 158 C286 126 376 158 399 234 C469 207 555 245 587 324 C628 315 670 327 710 370 L710 430 L-60 430 Z"/>
        </g>
        <g class="cc-cloud-bank cc-cloud-bank-right">
          <path d="M876 360 C936 312 988 312 1040 325 C1067 243 1157 207 1224 252 C1273 145 1385 117 1460 181 C1536 116 1623 152 1660 244 L1660 430 L876 430 Z"/>
        </g>
      </svg>
    </div>
  </div>
</section>
<script>
(function(){
  var scene=document.querySelector('.cc-hero');
  if(!scene||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var ticking=false;
  function paint(){
    ticking=false;
    var rect=scene.getBoundingClientRect();
    var distance=Math.max(1,rect.height-window.innerHeight);
    var progress=Math.min(1,Math.max(0,-rect.top/distance));
    scene.style.setProperty('--cc-scroll',progress.toFixed(4));
    scene.style.setProperty('--cc-cloud-rise',(-22*progress).toFixed(1)+'px');
    scene.style.setProperty('--cc-beam-shift',(-12*progress).toFixed(1)+'px');
  }
  function schedule(){if(!ticking){ticking=true;requestAnimationFrame(paint)}}
  window.addEventListener('scroll',schedule,{passive:true});
  window.addEventListener('resize',schedule,{passive:true});
  paint();
})();
</script>
