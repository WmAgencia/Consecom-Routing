[build]
builder = "NIXPACKS"

[phases.setup]
nixPkgs = ["nodejs_24", "pnpm"]

[phases.install]
cmds = ["corepack enable && pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm turbo run build --filter=@consecom/api"]

[start]
cmd = "cd apps/api && node --import tsx/esm src/main.ts"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
